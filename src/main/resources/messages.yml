      FLY:
        material: "ELYTRA"
        disabled-material: "GRAY_STAINED_GLASS"
      SPEED:
        material: "SUGAR"
        disabled-material: "GRAY_STAINED_GLASS"
      JESUS:
        material: "WET_SPONGE"
        disabled-material: "GRAY_STAINED_GLASS"
      NOFALL:
        material: "FEATHER"
        disabled-material: "GRAY_STAINED_GLASS"
      KILLAURA:
        material: "IRON_SWORD"
        disabled-material: "GRAY_STAINED_GLASS"
  detail:
    title: "&d&lVirgolaAC &8- &f{check}"
    info-item:
      name: "&d&l{check}"
      lore:
        - "&7&n────────────────────"
        - "&eTipo: &f{type}"
        - ""
        - "{description}"
        - ""
        - "&7Stato: {state}"
      separator: "&7──────────────────"
      type: "&eTipo: &f{type}"
      state: "&eStato: &f{state}"
    extras-header: "&6&lDettagli:"
    bullet: "&7• &f"
    bullet-cont: "  &f"
    settings-item:
      param-name-format: "&6{param}"
      value: "&7Value: &f{value}"
      click-toggle: "&eClick to toggle"
