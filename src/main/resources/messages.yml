      name-enabled: "&a&l{check}"
      name-disabled: "&c&l{check}"
      short-lore:
        - "&e&l▶ &fClicca per maggiori informazioni"
    status-item:
      name: "&b&lStato Server"
      tps: "&7TPS: {color}{tps}"
      players: "&7Players: &f{online}&7/&f{max}"
